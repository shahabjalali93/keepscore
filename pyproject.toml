[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keepscore"
version = "0.1.0"
description = "Score whether a trading signal actually predicts anything — and refuse to answer until it can."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [{ name = "Wizafsky" }]
keywords = ["trading", "backtesting", "signals", "statistics", "quant", "bootstrap"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shahabjalali93/keepscore"
Issues = "https://github.com/shahabjalali93/keepscore/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/keepscore"]
